enum FriendStatus {
  INCOMING_REQUEST
  OUTGOING_REQUEST
  ACCEPTED
}

enum FriendRelationship {
  NONE
  INCOMING_REQUEST
  OUTGOING_REQUEST
  ACCEPTED
}

type Profile {
  userId: ID!
  displayName: String!
  bio: String
  avatar: String
  email: String
  createdAt: String
  friendStatus: FriendRelationship!
}

type FriendEdge {
  userId: ID!
  status: FriendStatus!
  createdAt: String!
  profile: Profile
}

type MovieGenre {
  id: Int!
  name: String!
}

type Movie {
  id: ID!
  title: String!
  overview: String
  posterPath: String
  backdropPath: String
  releaseDate: String
  voteAverage: Float
  voteCount: Int
  runtime: Int
  genres: [MovieGenre!]
  tagline: String
}

type Query {
  getProfile: Profile
  getProfileById(userId: ID!): Profile
  searchProfiles(query: String!): [Profile!]!
  listFriendEdges: [FriendEdge!]!
  searchMovies(query: String!): [Movie!]!
  getMovie(id: ID!): Movie
}

type Mutation {
  createProfile(displayName: String!, bio: String, avatar: String): Profile
  sendFriendRequest(userId: ID!): FriendEdge
  acceptFriendRequest(userId: ID!): FriendEdge
  removeFriend(userId: ID!): Boolean
}
