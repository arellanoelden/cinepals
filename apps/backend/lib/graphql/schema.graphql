enum FriendStatus {
  INCOMING_REQUEST
  OUTGOING_REQUEST
  ACCEPTED
}

enum FriendRelationship {
  NONE
  INCOMING_REQUEST
  OUTGOING_REQUEST
  ACCEPTED
}

type Profile {
  userId: ID!
  displayName: String!
  bio: String
  avatar: String
  email: String
  createdAt: String
  friendStatus: FriendRelationship!
}

type FriendEdge {
  userId: ID!
  status: FriendStatus!
  createdAt: String!
  profile: Profile
}

type MovieGenre {
  id: Int!
  name: String!
}

type Movie {
  id: ID!
  title: String!
  overview: String
  posterPath: String
  backdropPath: String
  releaseDate: String
  voteAverage: Float
  voteCount: Int
  runtime: Int
  genres: [MovieGenre!]
  tagline: String
}

type Media {
  key: String!
  url: String!
}

type Review {
  # ID of the reviewed item - currently always a TMDB movie id, but kept
  # generic (not "movieId") so TV shows can be reviewed later too.
  mediaId: ID!
  userId: ID!
  createdAt: String!
  rating: Float!
  content: String
  media: [Media!]
  movie: Movie
}

type UploadTarget {
  url: String!
  key: String!
  fields: AWSJSON!
}

type Query {
  getProfile: Profile
  getProfileById(userId: ID!): Profile
  searchProfiles(query: String!): [Profile!]!
  listFriendEdges: [FriendEdge!]!
  searchMovies(query: String!): [Movie!]!
  getMovie(id: ID!): Movie
  myReviews: [Review!]!
}

type Mutation {
  createProfile(displayName: String!, bio: String, avatar: String): Profile
  sendFriendRequest(userId: ID!): FriendEdge
  acceptFriendRequest(userId: ID!): FriendEdge
  removeFriend(userId: ID!): Boolean
  createReview(mediaId: ID!, rating: Float!, content: String, mediaKeys: [String!]): Review
  generateUploadUrl(contentType: String!, fileExtension: String!): UploadTarget
}
